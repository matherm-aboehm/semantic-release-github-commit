name: Release
"on":
  push:
    branches:
      - main
      - next
      - beta
      - "*.x"

permissions:
  contents: read # for checkout
  id-token: write # to enable use of OIDC for npm provenance
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app_token
        with:
          client-id: ${{ vars.SEMANTIC_RELEASE_GITHUB_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_GITHUB_COMMIT_PRIVATE_KEY }}
          permission-contents: write # to be able to publish a GitHub release
          permission-issues: write # to be able to comment on released issues
          permission-pull-requests: write # to be able to comment on released pull requests

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: lts/*

      - run: npm clean-install

      - name: Build plugin
        run: npm run build

      - run: npm install --global corepack@latest

      - run: corepack npm audit signatures

      - run: npx semantic-release ${DEBUG_ARG}
        env:
          DEBUG_ARG: ${{ case(runner.debug == '1', '--debug', '') }}
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: 'https://npm.pkg.github.com'
