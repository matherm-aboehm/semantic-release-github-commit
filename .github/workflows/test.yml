name: Test
"on":
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    types:
      - opened
      - synchronize

env:
  FORCE_COLOR: 1
  NPM_CONFIG_COLOR: always

jobs:
  # verify against ranges defined as supported in engines.node
  test_matrix:
    strategy:
      matrix:
        node-version:
          - 22.14.0
          - 24.10.0
          - 24
        os:
          - ubuntu-latest
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Use Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ matrix.node-version }}"
          cache: npm
      - run: npm clean-install
      - run: npm install --global corepack@latest
      - run: corepack npm audit signatures
      - run: npm test

  # verify against the node version defined for development in the .nvmrc
  test_dev:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: git config --global user.name github-actions
      - run: git config --global user.email github-actions@github.com
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm clean-install
      - run: npm install --global corepack@latest
      - run: corepack npm audit signatures
      - run: npx jest --ci --coverage --json --testLocationInResults --outputFile=report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            report.json
            coverage/**

  coverage:
    runs-on: ubuntu-latest
    needs:
      - test_dev
    if: always()
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.base.sha, github.sha) }}
          fetch-depth: 2
      - run: |
          if [[ "$EVENT_NAME" == "push" ]]
          then
            git checkout "HEAD^"
            # use following if not checking out parent sha:
            # COMMIT_SHA=$(git rev-parse "${COMMIT_SHA}^")
            # use alternative if not checked out at all:
            # COMMIT_SHA=$(gh api repos/{owner}/{repo}/commits/$COMMIT_SHA | jq -r '.parents[0].sha')
          fi
          COMMIT_SHA=$(git log -1 --format=%H)
          CHECK_RUNS_JSON=$(gh api repos/{owner}/{repo}/commits/$COMMIT_SHA/check-runs)
          RUN_IDS=$(echo $CHECK_RUNS_JSON | jq -r '.check_runs[] | select(.name == "test_dev") | .html_url | capture("/runs/(?<number>[0-9]+)/job") | .number')
          if [[ $(echo "$RUN_IDS" | wc -l) -eq 1 ]]
          then
              echo "Found check run id $RUN_IDS for commit $COMMIT_SHA"
              echo "Waiting for workflow run to complete..."
              gh run watch $RUN_IDS --exit-status > /dev/null 2>&1
              echo "run_id=$RUN_IDS" >> "${GITHUB_OUTPUT}"
              exit 0
          fi
          echo "$RUN_IDS" | while read -r run
          do
            run_event=$(gh run view $run --json event | jq -r '.event')
            if [[ "$run_event" == "$EVENT_NAME" ]]
            then
              echo "Found check run id $run for commit $COMMIT_SHA"
              echo "Waiting for workflow run to complete..."
              gh run watch $run --exit-status > /dev/null 2>&1
              echo "run_id=$run" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "Failed to find check run id for commit $COMMIT_SHA"
          exit 1
        id: get-run-id
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
      # checking for artifact existence of other run not possible with this action
      #- uses: softwareforgood/check-artifact-v4-existence@v0.4.1
      #  id: base-coverage-artifact
      #  with:
      #    name: coverage
      - uses: actions/download-artifact@v8
        id: download-base-coverage
        if: ${{ steps.get-run-id.outcome != 'failure' }}
        continue-on-error: true
        with:
          name: coverage
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}
      # BEGIN: redo test coverage on PR base or parent commit
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.download-base-coverage.outcome != 'success' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm clean-install
        if: ${{ steps.download-base-coverage.outcome != 'success' }}
      - run: npm install --global corepack@latest
        if: ${{ steps.download-base-coverage.outcome != 'success' }}
      - run: corepack npm audit signatures
        if: ${{ steps.download-base-coverage.outcome != 'success' }}
      - run: npx jest --ci --coverage --json --testLocationInResults --outputFile=report.json
        if: ${{ steps.download-base-coverage.outcome != 'success' }}
      # END: redo test coverage on PR base or parent commit
      - uses: actions/download-artifact@v8
        if: always()
        id: download-head-coverage
        with:
          name: coverage
          path: ./head-coverage
      # remove event payload data file, if setting env var doesn't work
      - run: |
          echo "Backup $GITHUB_EVENT_PATH ..."
          cp "$GITHUB_EVENT_PATH" ~/event_payload_data.json
          echo '{}' >> "$GITHUB_EVENT_PATH"
          echo "$GITHUB_EVENT_PATH overridden."
      - uses: ArtiomTr/jest-coverage-report-action@262a7bb0b20c4d1d6b6b026af0f008f78da72788 # v2.3.1
        id: coverage
        with:
          skip-step: all
          annotations: all
          coverage-file: ./head-coverage/report.json
          base-coverage-file: ./report.json
          threshold: 100
          # set prnumber explicitly to something that can't be converted to number
          prnumber: NaN
          output: report-markdown
        env:
          # remove event payload data from action step, so the action
          # can't see pull_request event data
          GITHUB_EVENT_PATH: ""
      # restore event payload data file
      - run: cp ~/event_payload_data.json "$GITHUB_EVENT_PATH"
      - run: |
          # add report to the workflow actions summary page
          echo "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
          # add report to the new "Coverage annotations" check run created by last step
          CHECK_RUNS_JSON=$(gh api repos/{owner}/{repo}/commits/$COMMIT_SHA/check-runs)
          CHECK_IDS=$(echo $CHECK_RUNS_JSON | jq -r '.check_runs[] | select(.name == "Coverage annotations (🧪 jest-coverage-report-action)") | .id')
          if [[ -z "$CHECK_IDS" ]]
          then
            # fall back to "Tests annotations" check run created by last step
            CHECK_IDS=$(echo $CHECK_RUNS_JSON | jq -r '.check_runs[] | select(.name == "Tests annotations (🧪 jest-coverage-report-action)") | .id')
          fi
          echo "$CHECK_IDS" | while read -r check_run_id
          do
            title=$(echo $CHECK_RUNS_JSON | jq -r ".check_runs[] | select(.id == ${check_run_id}) | .output.title")
            text=$(echo $CHECK_RUNS_JSON | jq -r ".check_runs[] | select(.id == ${check_run_id}) | .output.text")
            text="${text:-null}"
            gh api --method PATCH /repos/{owner}/{repo}/check-runs/${check_run_id} \
              -f "output[title]=${title}" \
              -f "output[summary]=${REPORT_MARKDOWN}" \
              -F "output[text]=${text}"
          done
        env:
          REPORT_MARKDOWN: ${{ steps.coverage.outputs.report }}
          COMMIT_SHA: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}

  # separate job to set as required in branch protection,
  # as the build names above change each time Node versions change
  test:
    runs-on: ubuntu-latest
    needs:
      - test_dev
      - test_matrix
      - coverage
    if: always()
    steps:
      - name: All matrix versions passed
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some matrix version failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
